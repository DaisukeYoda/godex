syntax = "proto3";

// Trimmed, wire-compatible subset of cosmos/base/v1beta1/coin.proto.
package cosmos.base.v1beta1;

option go_package = "github.com/DaisukeYoda/godex/dydx/internal/pb/cosmos/base/v1beta1";

// Coin is a denom/amount pair. godex only ever encodes an empty fee list
// (short-term orders are free), but the field must exist to build AuthInfo.
message Coin {
  string denom = 1;
  string amount = 2;
}
