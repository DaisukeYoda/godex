syntax = "proto3";

// Trimmed, wire-compatible subset of cosmos/tx/signing/v1beta1/signing.proto.
// Only the SignMode enum is needed; godex always signs SIGN_MODE_DIRECT.
package cosmos.tx.signing.v1beta1;

option go_package = "github.com/DaisukeYoda/godex/dydx/internal/pb/cosmos/tx/signing/v1beta1";

// SignMode selects the payload a signature commits to.
enum SignMode {
  SIGN_MODE_UNSPECIFIED = 0;
  // SIGN_MODE_DIRECT signs the protobuf-encoded SignDoc.
  SIGN_MODE_DIRECT = 1;
  SIGN_MODE_TEXTUAL = 2;
  SIGN_MODE_DIRECT_AUX = 3;
  SIGN_MODE_LEGACY_AMINO_JSON = 127;
}
